services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      ASSISTANT_DATABASE_PATH: /app/data/friday.db
      HF_HOME: /models/huggingface
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
      - "8334:8334/udp"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - friday-data:/app/data
      - friday-models:/models
      - ./data/tls:/app/tls:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --ws-ping-timeout
      - "60"
      - --ssl-certfile
      - /app/tls/friday-backend.crt
      - --ssl-keyfile
      - /app/tls/friday-backend.key

volumes:
  friday-data:
  friday-models:
