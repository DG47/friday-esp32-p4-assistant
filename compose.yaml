services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      ASSISTANT_DATABASE_PATH: /app/data/friday.db
      HF_HOME: /models/huggingface
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - friday-data:/app/data
      - friday-models:/models

volumes:
  friday-data:
  friday-models:
